<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#0b3d2e">
  <title>Strutture – RENAI 2026</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header class="app-header">
    <a href="index.html" class="back-link">← Home</a>
    <h1>Strutture</h1>
    <p class="subtitle">Formazione, isole, servizi e formatori</p>
    <p class="date">Sabato 10 ottobre 2026 · Parco dei Renai, Signa</p>
  </header>

  <main class="app-main">

    <div class="struttura-selector">
      <label for="strutturaSelect">🔽 Seleziona la Struttura</label>
      <select id="strutturaSelect">
        <option value="">— Scegli una struttura —</option>
      </select>
    </div>

    <div id="strutturaContainer">
      <div class="empty-state">
        Seleziona una struttura per visualizzare isole, servizi e formatori.
      </div>
    </div>

  </main>

  <footer class="app-footer">
    <p>Regione Toscana · Direzione Difesa del Suolo e Protezione Civile</p>
    <p class="version">RENAI 2026 · v2.0</p>
  </footer>

  <script>
    // ============================================
    // STRUTTURE - RENAI 2026
    // ============================================

    const ARGOMENTI = {
      "RONDA": "Modalità di esecuzione ronde, lettura aste idrometriche e segnalazione fontanazzi.",
      "OPERE": "Manovra di paratoie, monitoraggio paratie e gestione manufatti idraulici.",
      "RETE MONITORAGGIO": "Interpretazione della rete di monitoraggio idro-meteo regionale.",
      "INSACCHETTATRICE": "Uso della macchina automatica con supporto Bobcat.",
      "SACCHINI": "Tecniche di insaccaggio manuale e realizzazione coronelle.",
      "TELONE": "Procedure di telonatura arginale per contrastare l'erosione superficiale.",
      "SOUP-RT": "Utilizzo del programma di sala operativa per il servizio di piena.",
      "SICUREZZA": "Norme comportamentali e utilizzo corretto dei DPI specialistici.",
      "COMUNICAZIONE": "Utilizzo delle radio e di un corretto linguaggio per le comunicazioni durante la specifica attività di servizio di piena.",
      "SEGNALAZIONI": "Segnalazione di criticità e gestione delle comunicazioni con la sala operativa."
    };

    const STRUTTURE = [
      // ---------- SICUREZZA E LOGISTICA ----------
      {
        id: "ANC",
        nome: "ANC – Associazione Nazionale Carabinieri",
        servizi: [
          { nome: "Sicurezza dell'area", descrizione: "Controllo degli accessi, vigilanza dell'area esercitativa e raccordo con i referenti della Protezione Civile." },
          { nome: "Viabilità e parcheggi", descrizione: "Indicazioni sui parcheggi riservati ai partecipanti, gestione della viabilità interna al Parco dei Renai e individuazione dei percorsi pedonali sicuri tra le isole formative, il punto ristoro e il palco istituzionale." },
          { nome: "Punto informativo logistico", descrizione: "Riferimento per l'orientamento all'interno dell'area: ubicazione dei servizi igienici, del punto ristoro, del palco istituzionale, delle isole formative e delle vie di fuga." }
        ],
        isole: []
      },

      // ---------- SERVIZI ----------
      {
        id: "ANPAS",
        nome: "ANPAS",
        servizi: [
          { nome: "Isola Ristoro – Pranzo", descrizione: "Gestione cucina e distribuzione dei due turni di pranzo (12:15–13:15 e 13:15–14:15)." }
        ],
        isole: [
          { lettera: "A", nome: "Ronda A", argomento: "RONDA", formatori: "Pazzi (di ANPAS)" },
          { lettera: "L", nome: "Sacchini L", argomento: "SACCHINI", formatori: "Mantellassi (di ANPAS)" }
        ]
      },
      {
        id: "MISERICORDIE",
        nome: "Misericordie",
        servizi: [
          { nome: "Pausa Caffè", descrizione: "Gestione del punto ristoro per la pausa caffè delle 10:45–11:15." }
        ],
        isole: []
      },

      // ---------- FORMAZIONE ----------
      {
        id: "GC-VS",
        nome: "Genio Civile Valdarno Superiore",
        isole: [
          { lettera: "A", nome: "Ronda A", argomento: "RONDA", formatori: "Di Paco, Liuti, Comanducci, Sassoli, Ruggiero" },
          { lettera: "B", nome: "Opere B", argomento: "OPERE", formatori: "Tinagli, Ruggiero, Dimaggio" },
          { lettera: "G", nome: "Opere G", argomento: "OPERE", formatori: "Moretti, Giannelli, Melucci, Riccucci Matteo, Pari" },
          { lettera: "L", nome: "Sacchini L", argomento: "SACCHINI", formatori: "Facenna, Vanni, Trovato, Riccucci Marco, Signorini" }
        ]
      },
      {
        id: "GC-NORD",
        nome: "Genio Civile Toscana Nord",
        isole: [
          { lettera: "E", nome: "Sacchini E", argomento: "SACCHINI", formatori: "Galliani, Del Carlo, Rossi" },
          { lettera: "I", nome: "Telone I", argomento: "TELONE", formatori: "Fico, Cruicchi, Grilli" }
        ]
      },
      {
        id: "GC-INF",
        nome: "Genio Civile Valdarno Inferiore",
        isole: [
          { lettera: "F", nome: "Ronda F", argomento: "RONDA", formatori: "Di Lauro, Bargi, Lazzaroni" },
          { lettera: "O", nome: "Ronda O", argomento: "RONDA", formatori: "Menicagli, Barsuglia, D'Isep" }
        ]
      },
      {
        id: "GC-CENTR",
        nome: "Genio Civile Valdarno Centrale",
        isole: [
          { lettera: "P", nome: "Telone P", argomento: "TELONE", formatori: "Alagia, Bazzani, Borchi, Gori, Molinaro, Restivo, Seghi, Tesi" },
          { lettera: "Q", nome: "Opere Q", argomento: "OPERE", formatori: "Gonnelli, Pierro, Reggiannini, Trinci, Cipriani, Longo" }
        ]
      },
      {
        id: "CFR",
        nome: "Centro Funzionale Regione Toscana",
        isole: [
          { lettera: "C", nome: "Rete Monitoraggio", argomento: "RETE MONITORAGGIO", formatori: "Trotta, Pisani, Criscuolo" }
        ]
      },
      {
        id: "CISOM",
        nome: "CISOM",
        isole: [
          { lettera: "D", nome: "Insacchettatrice", argomento: "INSACCHETTATRICE", formatori: "Ballini, Massai, Zito" }
        ]
      },
      {
        id: "CSN",
        nome: "Centro Scienze Naturali Prato",
        isole: [
          { lettera: "H", nome: "Segnalazioni", argomento: "SEGNALAZIONI", formatori: "Tozzi Saverio" }
        ]
      },
      {
        id: "CRI",
        nome: "Croce Rossa Italiana – Comitato Toscana",
        isole: [
          { lettera: "M", nome: "Sicurezza", argomento: "SICUREZZA", formatori: "Lucarini" }
        ]
      },
      {
        id: "PCRT",
        nome: "Protezione Civile Regione Toscana",
        servizi: [
          { nome: "Segreteria Operativa", descrizione: "Registrazione partecipanti e gestione schede di flusso individuale (07:30–08:45)." }
        ],
        isole: [
          { lettera: "N", nome: "Soup-RT", argomento: "SOUP-RT", formatori: "Mugnai Poggesi, Leparulo" },
          { lettera: "R", nome: "TLC - Comunicazioni", argomento: "COMUNICAZIONE", formatori: "Ottanelli, Benvenuti" }
        ]
      }
    ];

    // Popola la tendina
    const select = document.getElementById("strutturaSelect");
    STRUTTURE.forEach(s => {
      const opt = document.createElement("option");
      opt.value = s.id;
      opt.textContent = s.nome;
      select.appendChild(opt);
    });

    // Render
    const container = document.getElementById("strutturaContainer");
    const emptyHTML = `<div class="empty-state">Seleziona una struttura per visualizzare isole, servizi e formatori.</div>`;

    function renderStruttura(id) {
      const s = STRUTTURE.find(x => x.id === id);
      if (!s) return;

      let html = `
        <div class="chart-section">
          <h2 class="struttura-title">${s.nome}</h2>
          <p class="struttura-sub">Dettagli della struttura</p>
      `;

      // Sezione SERVIZI
      if (s.servizi && s.servizi.length > 0) {
        html += `<div class="sezione-title">🛠️ Servizi garantiti</div>`;
        s.servizi.forEach(sv => {
          html += `
            <div class="isola-item isola-item--servizio">
              <div class="isola-item-header">
                <span class="isola-badge isola-badge--servizio">SERVIZIO</span>
                <span class="isola-nome">${sv.nome}</span>
              </div>
              <div class="isola-argomento">${sv.descrizione}</div>
            </div>
          `;
        });
      }

      // Sezione ISOLE / FORMAZIONE
      if (s.isole && s.isole.length > 0) {
        html += `<div class="sezione-title">🏝️ Isole formative</div>`;
        s.isole.forEach(i => {
          const descr = ARGOMENTI[i.argomento] || "";
          html += `
            <div class="isola-item">
              <div class="isola-item-header">
                <span class="isola-badge">ISOLA ${i.lettera}</span>
                <span class="isola-nome">${i.nome}</span>
              </div>
              <div class="isola-argomento"><strong>${i.argomento}</strong> — ${descr}</div>
              <div class="isola-formatori">👤 Formatori: ${i.formatori}</div>
            </div>
          `;
        });
      }

      html += `</div>`;
      container.innerHTML = html;
    }

    select.addEventListener("change", function() {
      if (this.value) renderStruttura(this.value);
      else container.innerHTML = emptyHTML;
    });
  </script>

</body>
</html>
