  <style>
    /* Selettore isola */
    .isola-selector {
      background: var(--card);
      border: 1px solid #262c38;
      border-radius: var(--radius);
      padding: 16px;
      margin-bottom: 18px;
    }
    .isola-selector label {
      display: block;
      font-size: 15px;
      color: var(--muted);
      margin-bottom: 8px;
      font-weight: 600;
    }
    .isola-selector select {
      width: 100%;
      background: #232936;
      border: 1px solid #2e3543;
      border-radius: 10px;
      padding: 14px;
      color: var(--text);
      font-size: 16px;
      font-family: inherit;
      -webkit-appearance: none;
      appearance: none;
      background-image: url("data:image/svg+xml;charset=UTF-8,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%239aa4b2' stroke-width='2'%3e%3cpolyline points='6 9 12 15 18 9'/%3e%3c/svg%3e");
      background-repeat: no-repeat;
      background-position: right 14px center;
      background-size: 20px;
      padding-right: 44px;
    }
    .isola-selector select:focus {
      outline: 2px solid var(--accent);
      outline-offset: 1px;
    }

    .empty-state {
      text-align: center;
      padding: 40px 20px;
      color: var(--muted);
      font-size: 15px;
      line-height: 1.5;
    }

    /* Intestazione */
    .isola-title {
      font-size: 22px;
      font-weight: 800;
      color: var(--accent);
      margin: 0 0 4px;
      letter-spacing: 0.3px;
    }
    .isola-sub {
      font-size: 14px;
      color: var(--muted);
      margin: 0 0 12px;
    }
    .isola-description {
      font-size: 15px;
      color: var(--text);
      line-height: 1.5;
      margin: 0 0 14px;
      padding: 12px 14px;
      background: #14532d;
      border-left: 4px solid var(--accent);
      border-radius: 10px;
    }
    .isola-meta {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-bottom: 18px;
      padding: 14px;
      background: var(--card);
      border: 1px solid #262c38;
      border-radius: var(--radius);
    }
    .isola-meta-row {
      display: flex;
      gap: 10px;
      font-size: 14px;
      line-height: 1.4;
    }
    .isola-meta-label {
      flex: 0 0 90px;
      color: var(--muted);
      font-weight: 600;
    }
    .isola-meta-value {
      flex: 1;
      color: var(--text);
    }

    /* Fasce */
    .fasce-list { list-style: none; margin: 0; padding: 0; }
    .fascia {
      display: flex;
      align-items: flex-start;
      gap: 14px;
      padding: 12px 14px;
      background: var(--card);
      border: 1px solid #262c38;
      border-radius: var(--radius);
      margin-bottom: 10px;
    }
    .fascia-time {
      flex: 0 0 110px;
      font-size: 14px;
      font-weight: 700;
      color: var(--accent);
      letter-spacing: 0.3px;
    }
    .fascia-squadre {
      flex: 1;
      font-size: 15px;
      color: var(--text);
      line-height: 1.5;
    }
    .fascia--pausa {
      background: #2a1f00;
      border-color: #3d2f00;
    }
    .fascia--pausa .fascia-squadre { color: #ffe9a8; }
    .fascia-empty {
      color: var(--muted);
      font-style: italic;
    }
  </style>

          content = "☕ Pausa Caffè";

          cls += " fascia--pausa";
          content = "🎤 Saluti Istituzionali";

          const squadre = d.fasce[orario];

            content = "Squadre: <strong>" + squadre + "</strong>";

            content = `<span class="fascia-empty">— nessuna squadra —</span>`;
          }

              <div class="fascia-squadre">${content}</div>
            </li>
