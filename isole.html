<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#0b3d2e">
  <title>Isole Formative – RENAI 2026</title>
  <link rel="stylesheet" href="style.css">
  <style>
    /* ============================================
       Selettore isola
       ============================================ */
    .isola-selector {
      background: var(--card);
      border: 1px solid #262c38;
      border-radius: var(--radius);
      padding: 16px;
      margin-bottom: 18px;
    }
    .isola-selector label {
      display: block;
      font-size: 15px;
      color: var(--muted);
      margin-bottom: 8px;
      font-weight: 600;
    }
    .isola-selector select {
      width: 100%;
      background: #232936;
      border: 1px solid #2e3543;
      border-radius: 10px;
      padding: 14px;
      color: var(--text);
      font-size: 16px;
      font-family: inherit;
      -webkit-appearance: none;
      appearance: none;
      background-image: url("data:image/svg+xml;charset=UTF-8,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%239aa4b2' stroke-width='2'%3e%3cpolyline points='6 9 12 15 18 9'/%3e%3c/svg%3e");
      background-repeat: no-repeat;
      background-position: right 14px center;
      background-size: 20px;
      padding-right: 44px;
    }
    .isola-selector select:focus {
      outline: 2px solid var(--accent);
      outline-offset: 1px;
    }

    /* Stato vuoto */
    .empty-state {
      text-align: center;
      padding: 40px 20px;
      color: var(--muted);
      font-size: 15px;
      line-height: 1.5;
    }

    /* Intestazione risultato */
    .isola-title {
      font-size: 22px;
      font-weight: 800;
      color: var(--accent);
      margin: 0 0 4px;
      letter-spacing: 0.3px;
    }
    .isola-sub {
      font-size: 14px;
      color: var(--muted);
      margin: 0 0 12px;
    }
    .isola-description {
      font-size: 15px;
      color: var(--text);
      line-height: 1.5;
      margin: 0 0 16px;
      padding: 12px 14px;
      background: #14532d;
      border-left: 4px solid var(--accent);
      border-radius: 10px;
    }

    /* Badge lettera isola */
    .isola-letters-badge {
      display: inline-block;
      background: #14532d;
      border: 1px solid #1f6f4a;
      color: #b9f6d0;
      font-size: 13px;
      font-weight: 700;
      padding: 3px 10px;
      border-radius: 6px;
      margin-bottom: 10px;
      letter-spacing: 0.5px;
    }

    /* Tabella fasce */
    .fasce-list {
      list-style: none;
      margin: 0;
      padding: 0;
    }
    .fascia {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 12px 14px;
      background: var(--card);
      border: 1px solid #262c38;
      border-radius: var(--radius);
      margin-bottom: 10px;
    }
    .fascia-time {
      flex: 0 0 110px;
      font-size: 14px;
      font-weight: 700;
      color: var(--accent);
      letter-spacing: 0.3px;
    }
    .fascia-squadre {
      flex: 1;
      font-size: 15px;
      color: var(--text);
      line-height: 1.4;
    }
    .fascia--pausa {
      background: #2a1f00;
      border-color: #3d2f00;
    }
    .fascia--pausa .fascia-squadre {
      color: #ffe9a8;
    }
    .fascia--istituzionale {
      background: #0e2942;
      border-color: #1e3d5c;
    }
    .fascia--istituzionale .fascia-squadre {
      color: #9ecbff;
    }
    .fascia-empty {
      color: var(--muted);
      font-style: italic;
    }
  </style>
</head>
<body>

  <header class="app-header">
    <a href="index.html" class="back-link">← Home</a>
    <h1>Isole Formative</h1>
    <p class="subtitle">Seleziona un'isola per vedere le squadre attese</p>
    <p class="date">Sabato 10 ottobre 2026 · 07:00 – 17:00</p>
  </header>

  <main class="app-main">

    <div class="isola-selector">
      <label for="isolaSelect">🔽 Seleziona l'Isola</label>
      <select id="isolaSelect">
        <option value="">— Scegli un'isola —</option>
      </select>
    </div>

    <div id="scheduleContainer">
      <div class="empty-state">
        Seleziona un'isola per visualizzare il cronoprogramma delle squadre attese.
      </div>
    </div>

  </main>

  <footer class="app-footer">
    <p>Regione Toscana · Direzione Difesa del Suolo e Protezione Civile</p>
    <p class="version">RENAI - 2026 · v1.0</p>
  </footer>

  <script>
    // ============================================
    // DESCRIZIONI ISOLE
    // ============================================
    const ISLAND_INFO = {
      A: { name: "Ronda",          desc: "Modalità di esecuzione ronde, lettura aste idrometriche e segnalazione fontanazzi." },
      B: { name: "Opere",          desc: "Manovra di paratoie, monitoraggio paratie e gestione manufatti idraulici." },
      C: { name: "Centro Funzionale", desc: "Interpretazione della rete di monitoraggio idro-meteo regionale." },
      D: { name: "Insacchettatrice",  desc: "Uso della macchina automatica con supporto Bobcat." },
      E: { name: "Sacchini",       desc: "Tecniche di insaccaggio manuale e realizzazione coronelle." },
      F: { name: "Ronda",          desc: "Modalità di esecuzione ronde, lettura aste idrometriche e segnalazione fontanazzi." },
      G: { name: "Opere",          desc: "Manovra di paratoie, monitoraggio paratie e gestione manufatti idraulici." },
      H: { name: "Segnalazioni",   desc: "Segnalazione di criticità e gestione delle comunicazioni con la sala operativa." },
      I: { name: "Telone",         desc: "Procedure di telonatura arginale per contrastare l'erosione superficiale." },
      L: { name: "Sacchini",       desc: "Tecniche di insaccaggio manuale e realizzazione coronelle." },
      M: { name: "Sicurezza",      desc: "Norme comportamentali e utilizzo corretto dei DPI specialistici." },
      N: { name: "SOUPRT",         desc: "Utilizzo del programma di sala operativa per il servizio di piena." },
      O: { name: "Ronda",          desc: "Modalità di esecuzione ronde, lettura aste idrometriche e segnalazione fontanazzi." },
      P: { name: "Telone",         desc: "Procedure di telonatura arginale per contrastare l'erosione superficiale." },
      Q: { name: "Opere",          desc: "Manovra di paratoie, monitoraggio paratie e gestione manufatti idraulici." },
      R: { name: "Comunicazione",  desc: "Utilizzo delle radio e di un corretto linguaggio per le comunicazioni durante la specifica attività di servizio di piena." }
    };

    // ============================================
    // ORDINE ISOLE E GRUPPI
    // ============================================
    const ISLAND_ORDER = ["A","B","C","D","E","F","G","H","I","L","M","N","O","P","Q","R"];

    const GROUPS = [
      { from: 1,  to: 5,  start: 0,  pranzo: 2 },
      { from: 6,  to: 10, start: 1,  pranzo: 2 },
      { from: 11, to: 15, start: 2,  pranzo: 2 },
      { from: 16, to: 20, start: 3,  pranzo: 2 },
      { from: 21, to: 25, start: 4,  pranzo: 2 },
      { from: 26, to: 30, start: 5,  pranzo: 1 },
      { from: 31, to: 35, start: 6,  pranzo: 1 },
      { from: 36, to: 40, start: 7,  pranzo: 1 },
      { from: 41, to: 45, start: 8,  pranzo: 1 },
      { from: 46, to: 50, start: 9,  pranzo: 1 },
      { from: 51, to: 55, start: 10, pranzo: 1 },
      { from: 56, to: 60, start: 11, pranzo: 1 },
      { from: 61, to: 65, start: 12, pranzo: 1 },
      { from: 66, to: 70, start: 13, pranzo: 2 },
      { from: 71, to: 75, start: 14, pranzo: 2 },
      { from: 76, to: 80, start: 15, pranzo: 2 }
    ];

    // ============================================
    // COSTRUISCI MAPPA: isola -> orario -> [squadre]
    // ============================================
    const isolaSlots = {};
    ISLAND_ORDER.forEach(l => isolaSlots[l] = {});

    function addSquadra(lettera, orario, squadraId) {
      if (!isolaSlots[lettera]) return;
      if (!isolaSlots[lettera][orario]) isolaSlots[lettera][orario] = [];
      isolaSlots[lettera][orario].push(squadraId);
    }

    // Gruppi volontari
    GROUPS.forEach(g => {
      const i1 = ISLAND_ORDER[g.start % 16];
      const i2 = ISLAND_ORDER[(g.start + 1) % 16];
      const i3 = ISLAND_ORDER[(g.start + 2) % 16];
      const i4 = ISLAND_ORDER[(g.start + 3) % 16];
      const i5 = ISLAND_ORDER[(g.start + 4) % 16];

      for (let id = g.from; id <= g.to; id++) {
        addSquadra(i1, "08:45 – 09:45", id);
        addSquadra(i2, "09:45 – 10:45", id);
        addSquadra(i3, "11:15 – 12:15", id);
        if (g.pranzo === 2) {
          addSquadra(i4, "12:15 – 13:15", id);
        } else {
          addSquadra(i4, "13:15 – 14:15", id);
        }
        addSquadra(i5, "14:30 – 15:30", id);
      }
    });

    // Squadre Istituzionali
    const IST = [
      { ids: ["A","B","C"], iso: ["C","D","H"] },
      { ids: ["D","E","F"], iso: ["D","H","M"] },
      { ids: ["G","H","I"], iso: ["H","M","Q"] },
      { ids: ["L","M","N"], iso: ["M","Q","R"] },
      { ids: ["O","P","Q"], iso: ["Q","R","C"] },
      { ids: ["R","S","T"], iso: ["R","C","D"] }
    ];

    IST.forEach(g => {
      g.ids.forEach(id => {
        addSquadra(g.iso[0], "08:45 – 09:45", id);
        addSquadra(g.iso[1], "09:45 – 10:45", id);
        addSquadra(g.iso[2], "11:15 – 12:15", id);
      });
    });

    // ============================================
    // POPOLA LA TENDINA
    // ============================================
    const select = document.getElementById("isolaSelect");
    ISLAND_ORDER.forEach(l => {
      const opt = document.createElement("option");
      opt.value = l;
      opt.textContent = "Isola " + l + " – " + ISLAND_INFO[l].name;
      select.appendChild(opt);
    });

    // ============================================
    // ORDINE CRONOLOGICO DELLE FASCE
    // ============================================
    const ORARI_ORDER = [
      { key: "08:45 – 09:45", type: "formativo" },
      { key: "09:45 – 10:45", type: "formativo" },
      { key: "10:45 – 11:15", type: "pausa",     label: "☕ Pausa Caffè" },
      { key: "11:15 – 12:15", type: "formativo" },
      { key: "12:15 – 13:15", type: "formativo" },
      { key: "13:15 – 14:00", type: "formativo" },
      { key: "13:15 – 14:15", type: "formativo" },
      { key: "14:15 – 14:30", type: "istituzionale", label: "🎤 Saluti Istituzionali" },
      { key: "14:30 – 15:30", type: "formativo" }
    ];

    // ============================================
    // RENDER
    // ============================================
    const container = document.getElementById("scheduleContainer");
    const emptyHTML = `<div class="empty-state">Seleziona un'isola per visualizzare il cronoprogramma delle squadre attese.</div>`;

    function renderIsola(lettera) {
      const info = ISLAND_INFO[lettera];
      if (!info) return;

      const slots = isolaSlots[lettera] || {};

      let html = `
        <div class="chart-section">
          <div class="isola-letters-badge">Isola ${lettera}</div>
          <h2 class="isola-title">${info.name}</h2>
          <p class="isola-sub">Squadre attese in questa isola · Sabato 10 ottobre 2026</p>
          <p class="isola-description">${info.desc}</p>
          <ul class="fasce-list">
      `;

      ORARI_ORDER.forEach(o => {
        const squadre = slots[o.key];
        let cls = "fascia";
        let content = "";

        if (o.type === "pausa") {
          cls += " fascia--pausa";
          content = o.label || "Pausa";
        } else if (o.type === "istituzionale") {
          cls += " fascia--istituzionale";
          content = o.label || "Saluti";
        } else if (squadre && squadre.length > 0) {
          // Raggruppa le squadre in blocchi consecutivi per leggibilità
          const sorted = squadre.slice().sort((a, b) => {
            const na = isNaN(a) ? Infinity : parseInt(a);
            const nb = isNaN(b) ? Infinity : parseInt(b);
            return na - nb;
          });
          content = "Squadre: <strong>" + sorted.join(", ") + "</strong>";
        } else {
          content = `<span class="fascia-empty">— nessuna squadra —</span>`;
        }

        html += `
            <li class="${cls}">
              <div class="fascia-time">${o.key}</div>
              <div class="fascia-squadre">${content}</div>
            </li>
        `;
      });

      html += `</ul></div>`;
      container.innerHTML = html;

      if (typeof window.highlightCurrentSlot === "function") {
        window.highlightCurrentSlot();
      }
    }

    select.addEventListener("change", function() {
      if (this.value) renderIsola(this.value);
      else container.innerHTML = emptyHTML;
    });
  </script>

  <script src="app.js"></script>

</body>
</html>
